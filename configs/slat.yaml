# SLat (shape) flow fine-tuning: TRELLIS.2 img2shape (1.3B) + LoRA r32 +
# depth-lift branch.
#   torchrun --nproc_per_node 8 train_lightning.py --config configs/slat.yaml data_root=/path/to/data
data_root: data

models:
  denoiser:
    name: LiftedSLatFlowModel
    args:
      resolution: 64               # latent grid (o-voxel 1024 / 16)
      in_channels: 32
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true
      use_checkpoint: true         # ~17k tokens per window
      dtype: bfloat16
      depth_lift_tau_m: 0.07       # surface tolerance (~1.5x the 64^3 pitch)
    lora:
      r: 32
      alpha: 64
    projection: null

dataset:
  name: ChunkCellSLat
  args:
    image_size: 1024               # the 1024 base was trained on 1024-px DINOv3 tokens
    lift_image_size: 1024
    depth_pack_suffix: "_gt.npz"
    resolution: 1024               # o-voxel resolution of the shape decoder
    pretrained_slat_dec: microsoft/TRELLIS.2-4B/ckpts/shape_dec_next_dc_f16c32_fp16
    normalization:                 # shape-latent standardization (TRELLIS.2 img2shape)
      mean: [0.781296, 0.018091, -0.495192, -0.558457, 1.060530, 0.093252, 1.518149, -0.933218,
             -0.732996, 2.604095, -0.118341, -2.143904, 0.495076, -2.179512, -2.130751, -0.996944,
             0.261421, -2.217463, 1.260067, -0.150213, 3.790713, 1.481266, -1.046058, -1.523667,
             -0.059621, 2.220780, 1.621212, 0.877230, 0.567247, -3.175944, -3.186688, 1.578665]
      std: [5.972266, 4.706852, 5.445010, 5.209927, 5.320220, 4.547237, 5.020802, 5.444004,
            5.226681, 5.683095, 4.831436, 5.286469, 5.652043, 5.367606, 5.525084, 4.730578,
            4.805265, 5.124013, 5.530808, 5.619001, 5.103930, 5.417670, 5.269677, 5.547194,
            5.634698, 5.235274, 6.110351, 5.511298, 6.237273, 4.879207, 5.347008, 5.405691]

trainer:
  name: CameraConditionedSparseFlowMatchingCFGTrainer
  args:
    batch_size_per_gpu: 2
    optimizer:
      name: AdamW
      args:
        lr:
          lora: 3.0e-5
          new: 1.0e-4
          embed: 1.0e-4            # conditioning branches (no weight decay)
        weight_decay:
          lora: 0.0
          new_weights: 0.01
        betas: [0.9, 0.95]
        eps: 1.0e-8
    lr_scheduler:
      name: LinearWarmupLRScheduler
      args:
        warmup_steps: 500
    p_uncond: 0.1                  # CFG dropout on the image (window positions are never dropped)
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-5
    finetune_ckpt:
      denoiser: microsoft/TRELLIS.2-4B/ckpts/slat_flow_img2shape_dit_1_3B_1024_bf16
    image_cond_model:
      name: DinoV3FeatureExtractor
      args:
        model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
        image_size: 1024

lightning:
  output_dir: results/train_slat
  token_balanced_batches: true
  max_steps: 200000
  val_check_interval: 1000
  accumulate_grad_batches: 1
  precision: bf16-mixed
  num_workers: 8
  log_every_n_steps: 1
  init_from_pretrained: true
  wandb:
    enable: false
    project: image-to-scene
    mode: online
  validation_render:
    enable: true
    num_frames: 120
    resolution: 512
    r: 2.0
    fov: 60.0
    cutaway_z_m: 999.0
    near_clip_frac: 0.15
    base_elevation_deg: 35.0
    elevation_amp_deg: 15.0
    elevation_cycles: 1.0
    sample_steps: 50
    guidance_strength: 3.0
    max_scenes: 4
    video_format: mp4
    fps: 30

# Each root holds <base>/scenes/<scene>/view_<vvv>/{images,chunks}; the split
# file lists the validation scenes ({"val_scenes": [...]}).
data:
  train:
    INDOOR:
      base: ${data_root}/indoor
      split_file: ${data_root}/indoor_split.json
      split: train
    OUTDOOR:
      base: ${data_root}/outdoor
      split_file: ${data_root}/outdoor_split.json
      split: train
  val:
    INDOOR:
      base: ${data_root}/indoor
      split_file: ${data_root}/indoor_split.json
      split: val
    OUTDOOR:
      base: ${data_root}/outdoor
      split_file: ${data_root}/outdoor_split.json
      split: val
